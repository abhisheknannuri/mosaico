[tool.poetry]
name = "mosaico-dashboard"
version = "0.1.0"
description = "Web dashboard for the Mosaico Data-Platform (FastAPI + htmx)"
authors = ["Abhishek Nannuri <abhishek.nannuri@outlook.com>"]
readme = "README.md"
license = "Apache-2.0"
keywords = ["mosaicolabs", "mosaico", "dashboard", "fastapi", "htmx", "robotics"]

packages = [{ include = "mosaico_dashboard", from = "src" }]

[tool.poetry.scripts]
mosaico-dashboard = "mosaico_dashboard.__main__:run"
mosaico-dashboard-worker = "mosaico_dashboard.run_worker:run"

# mosaicolabs (SDK) is installed separately: scripts/dev_setup.sh (dev), Dockerfile (prod).
[tool.poetry.dependencies]
python = ">=3.10,<4"
fastapi = ">=0.115.0,<1.0.0"
uvicorn = { version = ">=0.32.0,<1.0.0", extras = ["standard"] }
jinja2 = "^3.1.4"
pydantic = "^2.12.5"
pydantic-settings = "^2.6.0"
rich = ">=14.3.3,<16.0.0"
sqlalchemy = ">=2.0,<3"
psycopg = {version = ">=3.2,<4", extras = ["binary"]}
alembic = ">=1.14,<2"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4.2"
ruff = ">=0.15.8,<0.17.0"
pyright = { version = ">=1.1.390", extras = ["nodejs"] }
httpx2 = "^2.13.1"
import-linter = "^2.15"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["COM812", "E501"]

[tool.ruff.format]
skip-magic-trailing-comma = false
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -rs"
markers = [
    "integration: needs a running mosaicod on localhost:6726",
    "database: needs a Postgres database (DASHBOARD_TEST_DATABASE_URL or dashboard-db on :5433)",
]

[tool.importlinter]
root_package = "mosaico_dashboard"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: (web | jobs) > services > (gateway | db) > domain"
type = "layers"
layers = [
    "mosaico_dashboard.web | mosaico_dashboard.jobs",
    "mosaico_dashboard.services",
    "mosaico_dashboard.gateway | mosaico_dashboard.db",
    "mosaico_dashboard.domain",
]

[[tool.importlinter.contracts]]
name = "Only the gateway imports the Mosaico SDK"
type = "forbidden"
source_modules = [
    "mosaico_dashboard.domain",
    "mosaico_dashboard.services",
    "mosaico_dashboard.web",
    "mosaico_dashboard.db",
]
forbidden_modules = ["mosaicolabs"]

[[tool.importlinter.contracts]]
name = "Domain and services are framework-agnostic"
type = "forbidden"
source_modules = ["mosaico_dashboard.domain", "mosaico_dashboard.services"]
forbidden_modules = ["fastapi", "starlette"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
