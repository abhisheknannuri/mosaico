[tool.poetry]
name = "mosaico-dashboard"
version = "0.1.0"
description = "Web dashboard for the Mosaico Data-Platform (FastAPI + htmx)"
authors = ["Abhishek Nannuri <abhishek.nannuri@outlook.com>"]
readme = "README.md"
license = "Apache-2.0"
keywords = ["mosaicolabs", "mosaico", "dashboard", "fastapi", "htmx", "robotics"]

packages = [{ include = "mosaico_dashboard", from = "src" }]

# mosaicolabs (SDK) is installed separately: scripts/dev_setup.sh (dev), Dockerfile (prod).
[tool.poetry.dependencies]
python = ">=3.10,<4"
fastapi = ">=0.115.0,<1.0.0"
uvicorn = { version = ">=0.32.0,<1.0.0", extras = ["standard"] }
jinja2 = "^3.1.4"
pydantic = "^2.12.5"
pydantic-settings = "^2.6.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4.2"
ruff = ">=0.15.8,<0.17.0"
pyright = { version = ">=1.1.390", extras = ["nodejs"] }
httpx2 = "^2.13.1"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["COM812", "E501"]

[tool.ruff.format]
skip-magic-trailing-comma = false
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
