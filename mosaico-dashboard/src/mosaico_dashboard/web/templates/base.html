<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mosaico Dashboard{% endblock %}</title>
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/vendor/htmx-2.0.11.min.js" defer></script>
</head>
<body>
  <header>
    <a class="brand" href="/">
      <img src="/static/img/mosaico-logo.svg" alt="Mosaico">
      <span>Dashboard</span>
    </a>
    <div class="daemon-status" hx-get="/status" hx-trigger="load, every 30s"></div>
  </header>
  <nav hx-boost="true">
    <a href="/">Overview</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
